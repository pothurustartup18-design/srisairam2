name: Release - Android APK

# Builds, signs, verifies and publishes a native APK update. Bump
# android/app/version.properties (VERSION_CODE + VERSION_NAME) in the commit
# first. Manual trigger only; production requires approval through the
# "production" GitHub Environment. See docs/APP_UPDATES.md.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [staging, production]
        default: staging
      release_notes:
        description: Release notes (separate items with |)
        type: string
        default: ''
      minimum_supported_version_code:
        description: Oldest versionCode still supported (older installs must update). Blank = keep all supported (1)
        type: string
        default: ''
      mandatory:
        description: Mark this update as required
        type: boolean
        default: false
      rollout_percent:
        description: Initial rollout percentage (1-100)
        type: number
        default: 100

concurrency:
  group: app-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-android:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    env:
      CHANNEL: ${{ inputs.channel }}
      # Inputs go through env, never straight into scripts (prevents injection).
      NOTES: ${{ inputs.release_notes }}
      ROLLOUT: ${{ inputs.rollout_percent }}
      MIN_INPUT: ${{ inputs.minimum_supported_version_code }}
      MANDATORY: ${{ inputs.mandatory }}
      API: ${{ vars.RELEASE_API_BASE }}
      BUCKET: ${{ vars.RELEASE_BUCKET }}
      AWS_REGION: ${{ vars.RELEASE_AWS_REGION }}
      EXPECTED_CERT: ${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests, update-code type check and lint
        run: |
          npm test
          npm run typecheck:updates
          npm run lint:updates

      - name: Read and validate version
        env:
          TOKEN: ${{ secrets.APP_RELEASE_CI_TOKEN }}
        run: |
          VC=$(grep '^VERSION_CODE=' android/app/version.properties | cut -d= -f2)
          VN=$(grep '^VERSION_NAME=' android/app/version.properties | cut -d= -f2)
          MIN="$MIN_INPUT"; MIN=${MIN:-1}
          [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || { echo "Invalid rollout_percent"; exit 1; }
          [[ "$VN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION_NAME must be MAJOR.MINOR.PATCH"; exit 1; }
          [[ "$MIN" =~ ^[0-9]+$ && "$MIN" -le "$VC" ]] || { echo "minimum_supported_version_code must be <= $VC"; exit 1; }
          HIGHEST=$(curl -sS --fail-with-body -H "X-Release-Token: $TOKEN" "$API/app-updates/admin/releases?kind=native&channel=$CHANNEL" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).data||[];console.log(Math.max(0,...r.map(x=>x.versionCode||0)))})')
          [ "$VC" -gt "$HIGHEST" ] || { echo "VERSION_CODE $VC must be greater than the highest registered ($HIGHEST). Bump android/app/version.properties."; exit 1; }
          echo "VC=$VC" >> "$GITHUB_ENV"; echo "VN=$VN" >> "$GITHUB_ENV"; echo "MIN_SUPPORTED=$MIN" >> "$GITHUB_ENV"

      - name: Build web assets and sync Android
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_UPDATE_CHANNEL: ${{ inputs.channel }}
          CAPACITOR_TELEMETRY: '0'
        run: |
          [ -n "$VITE_API_URL" ] || { echo "vars.VITE_API_URL is not set"; exit 1; }
          npm run build
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Verify signature, package and version
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "Signed APK missing (is the keystore configured?)"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose "$APK" > /dev/null
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          [ "$CERT" = "$EXPECTED_CERT" ] || { echo "APK signed with unexpected certificate"; exit 1; }
          BADGING=$("$BT/aapt2" dump badging "$APK" | head -1)
          echo "$BADGING" | grep -q "name='com.schoolhub.app'" || { echo "Wrong package: $BADGING"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$VC'" || { echo "Wrong versionCode: $BADGING"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VN'" || { echo "Wrong versionName: $BADGING"; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Sign release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          printf '%s' "$NOTES" > notes.txt
          MANDATORY_FLAG=""; [ "$MANDATORY" = "true" ] && MANDATORY_FLAG="--mandatory"
          node scripts/release/release-tool.mjs native --apk "$APK_PATH" --channel "$CHANNEL" \
            --version-name "$VN" --version-code "$VC" --min-supported "$MIN_SUPPORTED" $MANDATORY_FLAG \
            --signing-cert-sha256 "$EXPECTED_CERT" --notes-file notes.txt --out release-out
          cat release-out/release.env >> "$GITHUB_ENV"

      - name: Upload artifact (immutable)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3api put-object --bucket "$BUCKET" --key "$ARTIFACT_KEY" --body "$ARTIFACT_PATH" \
            --content-type application/vnd.android.package-archive \
            --checksum-algorithm SHA256 --checksum-sha256 "$ARTIFACT_SHA256_B64" \
            --if-none-match '*' > /dev/null
          REMOTE=$(aws s3api head-object --bucket "$BUCKET" --key "$ARTIFACT_KEY" --checksum-mode ENABLED --query ChecksumSHA256 --output text)
          [ "$REMOTE" = "$ARTIFACT_SHA256_B64" ] || { echo "Uploaded checksum mismatch"; exit 1; }
          aws s3 cp "s3://$BUCKET/$ARTIFACT_KEY" downloaded.apk --only-show-errors
          echo "$ARTIFACT_SHA256  downloaded.apk" | sha256sum -c -

      - name: Keep APK as a workflow artifact (for manual installs)
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-${{ env.VN }}-${{ env.VC }}-${{ inputs.channel }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Register and publish release
        env:
          TOKEN: ${{ secrets.APP_RELEASE_CI_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST "$API/app-updates/admin/releases" \
            -H "Content-Type: application/json" -H "X-Release-Token: $TOKEN" \
            --data-binary @release-out/release.json
          echo
          curl -sS --fail-with-body -X POST "$API/app-updates/admin/releases/$RELEASE_ID/publish" \
            -H "Content-Type: application/json" -H "X-Release-Token: $TOKEN" \
            -d "{\"rolloutPercent\": $ROLLOUT}"
          echo

      - name: Post-publication check
        run: |
          curl -sS --fail-with-body "$API/app-updates/releases/$RELEASE_ID" | grep -q '"status":"published"'
          echo "### Published APK \`$RELEASE_ID\` (v$VN, code $VC) to **$CHANNEL** ($ROLLOUT%)" >> "$GITHUB_STEP_SUMMARY"
