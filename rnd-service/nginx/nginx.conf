events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Set client upload body limit (useful for backups or file uploads)
    client_max_body_size 50M;

    # Standard proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    # 1. HTTP Server Configuration
    # Handles normal API requests on port 80.
    # In production, redirect this to HTTPS by uncommenting the redirect line.
    server {
        listen 80;
        server_name localhost; # Replace with your domain in production, e.g. api.yourdomain.com

        # Uncomment to enforce HTTPS redirection in production:
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://backend:5000;
        }
    }

    # 2. HTTPS Server Configuration (Production Only)
    # Uncomment this entire block once you have set up SSL certificates via Certbot / Let's Encrypt.
    #
    # server {
    #     listen 443 ssl;
    #     server_name api.yourdomain.com;
    #
    #     # Paths to your SSL certificates inside the container
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # Modern SSL security settings
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     location / {
    #         proxy_pass http://backend:5000;
    #     }
    # }
}
